[project]
name = "labs"
dynamic = ["version"]
description = "Small Python labs as pure, tested functions with a CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
]

[project.scripts]
labs = "labs.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/labs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/labs"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "RET", "ARG", "TC", "PL", "A"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
